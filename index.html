<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>AmarBank</title>

</head>

  <div class="container nav">

      <div class="logo-dot"></div>

    <nav>

      <a href="advisor.html">Advisor</a>
