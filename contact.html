<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | AmarBank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- (Include Header) -->
<div class="gov-width">
    <div class="main-container">
        <h1>Contact the Financial Desk</h1>
        <p>If you need help choosing a bank, leave your details below.</p>
        <form style="display:flex; flex-direction:column; gap:15px; max-width:400px;">
            <label>Full Name</label>
            <input type="text" style="padding:10px; border:2px solid var(--gov-black);">
            <label>Phone Number</label>
            <input type="tel" style="padding:10px; border:2px solid var(--gov-black);">
            <button class="cta-button" type="button" onclick="alert('Request Sent!')">Request Call Back</button>
        </form>
    </div>
</div>
<footer>
    <p>AmarBank Bangladesh | Built by SADAB</p>
</footer>
</body>
</html>
