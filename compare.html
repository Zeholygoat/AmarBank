<!DOCTYPE html>
<html>
<head>
<title>Compare</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
<div class="container"><h2>Comparison Matrix</h2></div>
</header>

<main class="container">
  <input type="text" id="search" placeholder="Search banks..." class="search-box">
<table id="t"></table>
</main>

<script type="module">
import {banks} from './data.js';

let t=document.getElementById("t");

t.innerHTML="<tr><th>Bank</th><th>FDR</th><th>Tech</th><th>Cards</th><th>ATM</th></tr>";

banks.forEach(b=>{
t.innerHTML+=`<tr>
<td>${b.name}</td>
<td>${b.fdr}%</td>
<td>${b.tech}</td>
<td>${b.cards}</td>
<td>${b.atm}</td>
</tr>`;
});
</script>

<footer>Created by Sadab</footer>

</body>
</html>
